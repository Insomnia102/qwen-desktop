name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    env:
      QWEN_USAGE_STATISTICS_ENABLED: 'false'
      QWEN_TELEMETRY_ENABLED: 'false'
      OTEL_SDK_DISABLED: 'true'
      QWEN_CODE_MODELS_DEV_REFRESH: 'off'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Check source before packaging
        run: node scripts/ci-check.mjs
      - name: Package native installer
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Check packaged Electron, bootstrap and bundled SDK
        run: node scripts/package-smoke.mjs
      - name: Collect installers and checksums
        run: node scripts/release-assets.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  publish:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Match tag to package version
        id: meta
        run: node scripts/ci-metadata.mjs
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify every platform and prepare release manifest
        run: node scripts/release-assets.mjs verify
      - name: Create draft and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
